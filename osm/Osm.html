<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kantou Koushinetsu Bounds Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Zen+Kaku+Gothic+New:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1e1e24; --card: #2b2b36; --text: #f5f5f5; --sub: #a1a1aa;
            --accent: #4ade80; --accent-hover: #22c55e; --danger: #f87171;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', 'Zen Kaku Gothic New', sans-serif; background: var(--bg); color: var(--text); padding: 24px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        
        .header-card { background: var(--card); padding: 24px; border-radius: var(--radius); box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid #3f3f46; }
        h1 { font-size: 1.6rem; margin-bottom: 8px; color: var(--accent); }
        p.desc { font-size: 0.85rem; color: var(--sub); line-height: 1.5; margin-bottom: 16px; }
        
        .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #18181b; padding: 16px; border-radius: 8px; border: 1px solid #3f3f46; }
        button { background: var(--accent); color: #000; border: none; padding: 12px 24px; font-weight: 800; font-size: 0.95rem; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-2px); }
        button:disabled { background: #52525b; color: #a1a1aa; cursor: not-allowed; }
        button.stop { background: var(--danger); color: #fff; }
        
        .stats { display: flex; gap: 24px; margin-top: 12px; }
        .stat-item { display: flex; flex-direction: column; }
        .stat-label { font-size: 0.7rem; color: var(--sub); text-transform: uppercase; }
        .stat-value { font-size: 1.4rem; font-weight: 900; font-variant-numeric: tabular-nums; }
        
        .progress-wrapper { width: 100%; height: 12px; background: #18181b; border-radius: 6px; overflow: hidden; margin-top: 16px; border: 1px solid #3f3f46; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #4ade80, #3b82f6); width: 0%; transition: width 0.3s ease; }
        
        .table-container { background: var(--card); border-radius: var(--radius); border: 1px solid #3f3f46; overflow: hidden; max-height: 500px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th { background: #18181b; color: var(--sub); padding: 12px 16px; position: sticky; top: 0; z-index: 10; font-size: 0.75rem; border-bottom: 1px solid #3f3f46; }
        td { padding: 10px 16px; border-bottom: 1px solid #3f3f46; color: #e4e4e7; font-variant-numeric: tabular-nums; }
        tr:hover td { background: #27272a; }
        .status-ok { color: #4ade80; font-weight: bold; }
        .status-err { color: #f87171; font-weight: bold; }
        .status-wait { color: #a1a1aa; }
        
        #jsonOutput { width: 100%; height: 150px; background: #18181b; color: #a1a1aa; font-family: monospace; font-size: 0.75rem; padding: 12px; border-radius: 8px; border: 1px solid #3f3f46; margin-top: 16px; resize: vertical; outline: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <h1>OSM Bounds Builder (Kantou-Koushinetsu)</h1>
            <p class="desc">
                関東甲信越（全10都県・約500市区町村）の行政界（Bounding Box）を<br>
                OpenStreetMap(Nominatim API)から自動で全件取得し、安全マージンを付与した最適JSONを生成します。<br>
                ※APIの制限(1秒1回)を遵守するため、全件取得には数分〜10分程度かかります。
            </p>
            
            <div class="controls">
                <button id="startBtn">🚀 全自動フェッチ開始</button>
                <button id="stopBtn" class="stop" disabled>🛑 中断</button>
                <button id="dlBtn" disabled>💾 JSONをダウンロード</button>
                
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">進捗</span>
                        <span class="stat-value"><span id="valCount">0</span> / <span id="valTotal">0</span></span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">成功 / エラー</span>
                        <span class="stat-value"><span id="valSuccess" style="color:#4ade80;">0</span> / <span id="valError" style="color:#f87171;">0</span></span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">状態</span>
                        <span class="stat-value" id="valStatus" style="font-size: 1rem; margin-top:6px;">待機中</span>
                    </div>
                </div>
            </div>
            
            <div class="progress-wrapper">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            
            <textarea id="jsonOutput" readonly placeholder="取得完了後、ここにJSONデータが出力されます..."></textarea>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px;">状態</th>
                        <th style="width: 100px;">県キー</th>
                        <th style="width: 150px;">市区町村</th>
                        <th>取得した境界 (Bounding Box) + 1kmマージン</th>
                        <th style="width: 120px;">400m地点数</th>
                    </tr>
                </thead>
                <tbody id="resultTable">
                    <!-- Results go here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- 1. 関東甲信越 全市区町村マスター定義 ---
        // ※「〜郡」などの名称をそのままAPIに投げると広すぎるため、直接の村・町名をリスト化しています。
        const CITIES_LIST = {
            nagano: ["長野市", "松本市", "上田市", "岡谷市", "飯田市", "諏訪市", "須坂市", "小諸市", "伊那市", "駒ヶ根市", "中野市", "大町市", "飯山市", "茅野市", "塩尻市", "佐久市", "千曲市", "東御市", "安曇野市", "小海町", "川上村", "南牧村", "南相木村", "北相木村", "佐久穂町", "軽井沢町", "御代田町", "立科町", "青木村", "長和町", "下諏訪町", "富士見町", "原村", "辰野町", "箕輪町", "飯島町", "南箕輪村", "中川村", "宮田村", "松川町", "高森町", "阿南町", "阿智村", "平谷村", "根羽村", "下條村", "売木村", "天龍村", "泰阜村", "喬木村", "豊丘村", "大鹿村", "上松町", "南木曽町", "木祖村", "王滝村", "大桑村", "木曽町", "麻績村", "生坂村", "山形村", "朝日村", "筑北村", "池田町", "松川村", "白馬村", "小谷村", "坂城町", "小布施町", "高山村", "山ノ内町", "木島平村", "野沢温泉村", "信濃町", "小川村", "飯綱町", "栄村"],
            yamanashi: ["甲府市", "富士吉田市", "都留市", "山梨市", "大月市", "韮崎市", "南アルプス市", "北杜市", "甲斐市", "笛吹市", "上野原市", "甲州市", "中央市", "市川三郷町", "早川町", "身延町", "南部町", "富士川町", "昭和町", "道志村", "西桂町", "忍野村", "山中湖村", "鳴沢村", "富士河口湖町", "小菅村", "丹波山村"],
            gunma: ["前橋市", "高崎市", "桐生市", "伊勢崎市", "太田市", "沼田市", "館林市", "渋川市", "藤岡市", "富岡市", "安中市", "みどり市", "榛東村", "甘楽町", "中之条町", "長野原町", "嬬恋村", "草津町", "高山村", "東吾妻町", "片品村", "川場村", "昭和村", "みなかみ町", "玉村町", "板倉町", "明和町", "千代田町", "大泉町", "邑楽町"],
            tochigi: ["宇都宮市", "足利市", "栃木市", "佐野市", "鹿沼市", "日光市", "小山市", "真岡市", "大田原市", "矢板市", "那須塩原市", "さくら市", "那須烏山市", "下野市", "上三川町", "益子町", "茂木町", "市貝町", "芳賀町", "壬生町", "野木町", "塩谷町", "高根沢町", "那須町", "那珂川町"],
            niigata: ["新潟市", "長岡市", "三条市", "柏崎市", "新発田市", "小千谷市", "加茂市", "十日町市", "見附市", "村上市", "燕市", "糸魚川市", "妙高市", "五泉市", "上越市", "阿賀野市", "佐渡市", "魚沼市", "南魚沼市", "胎内市", "聖籠町", "弥彦村", "田上町", "阿賀町", "出雲崎町", "湯沢町", "津南町", "刈羽村", "関川村", "粟島浦村"],
            saitama: ["さいたま市", "川越市", "熊谷市", "川口市", "行田市", "秩父市", "所沢市", "飯能市", "加須市", "本庄市", "東松山市", "春日部市", "狭山市", "羽生市", "鴻巣市", "深谷市", "上尾市", "草加市", "越谷市", "蕨市", "戸田市", "入間市", "朝霞市", "志木市", "和光市", "新座市", "桶川市", "久喜市", "北本市", "八潮市", "富士見市", "三郷市", "蓮田市", "坂戸市", "幸手市", "鶴ヶ島市", "日高市", "吉川市", "ふじみ野市", "白岡市", "伊奈町", "三芳町", "毛呂山町", "越生町", "滑川町", "嵐山町", "小川町", "川島町", "吉見町", "鳩山町", "ときがわ町", "横瀬町", "皆野町", "長瀞町", "小鹿野町", "東秩父村", "美里町", "神川町", "上里町", "寄居町", "宮代町", "杉戸町", "松伏町"],
            tokyo: ["千代田区", "中央区", "港区", "新宿区", "文京区", "台東区", "墨田区", "江東区", "品川区", "目黒区", "大田区", "世田谷区", "渋谷区", "中野区", "杉並区", "豊島区", "北区", "荒川区", "板橋区", "練馬区", "足立区", "葛飾区", "江戸川区", "八王子市", "立川市", "武蔵野市", "三鷹市", "青梅市", "府中市", "昭島市", "調布市", "町田市", "小金井市", "小平市", "日野市", "東村山市", "国分寺市", "国立市", "福生市", "狛江市", "東大和市", "清瀬市", "東久留米市", "武蔵村山市", "多摩市", "稲城市", "羽村市", "あきる野市", "西東京市", "瑞穂町", "日の出町", "檜原村", "奥多摩町", "大島町", "利島村", "新島村", "神津島村", "三宅村", "御蔵島村", "八丈町", "青ヶ島村", "小笠原村"],
            kanagawa: ["横浜市", "川崎市", "相模原市", "横須賀市", "平塚市", "鎌倉市", "藤沢市", "小田原市", "茅ヶ崎市", "逗子市", "三浦市", "秦野市", "厚木市", "大和市", "伊勢原市", "海老名市", "座間市", "南足柄市", "綾瀬市", "葉山町", "寒川町", "大磯町", "二宮町", "中井町", "大井町", "松田町", "山北町", "開成町", "箱根町", "真鶴町", "湯河原町", "愛川町", "清川村"],
            chiba: ["千葉市", "銚子市", "市川市", "船橋市", "館山市", "木更津市", "松戸市", "野田市", "茂原市", "成田市", "佐倉市", "東金市", "旭市", "習志野市", "柏市", "勝浦市", "市原市", "流山市", "八千代市", "我孫子市", "鴨川市", "鎌ケ谷市", "君津市", "富津市", "浦安市", "四街道市", "袖ケ浦市", "八街市", "印西市", "白井市", "富里市", "南房総市", "匝瑳市", "香取市", "山武市", "いすみ市", "大網白里市", "酒々井町", "栄町", "神崎町", "多古町", "東庄町", "九十九里町", "芝山町", "横芝光町", "一宮町", "睦沢町", "長生村", "白子町", "長柄町", "長南町", "大多喜町", "御宿町", "鋸南町"],
            ibaraki: ["水戸市", "日立市", "土浦市", "古河市", "石岡市", "結城市", "龍ケ崎市", "下妻市", "常総市", "常陸太田市", "高萩市", "北茨城市", "笠間市", "取手市", "牛久市", "つくば市", "ひたちなか市", "鹿嶋市", "潮来市", "守谷市", "常陸大宮市", "那珂市", "筑西市", "坂東市", "稲敷市", "かすみがうら市", "桜川市", "神栖市", "行方市", "鉾田市", "つくばみらい市", "小美玉市", "茨城町", "大洗町", "城里町", "東海村", "大子町", "美浦村", "阿見町", "河内町", "八千代町", "五霞町", "境町", "利根町"]
        };

        const FIXED_MESH = 0.004; // 400mメッシュ
        const SAFE_MARGIN = 0.01; // 約1kmの安全マージン（山肌切れ防止）
        
        let targetQueue = [];
        let resultData = {};
        let isRunning = false;
        let cTotal = 0, cSuccess = 0, cError = 0;

        const $ = id => document.getElementById(id);
        
        function initQueue() {
            targetQueue = [];
            resultData = {};
            const tbody = $('resultTable');
            tbody.innerHTML = '';
            cTotal = 0; cSuccess = 0; cError = 0;

            for (const [pref, cities] of Object.entries(CITIES_LIST)) {
                resultData[pref] = [];
                cities.forEach(city => {
                    targetQueue.push({ pref, city });
                    cTotal++;
                    
                    const tr = document.createElement('tr');
                    tr.id = `row-${pref}-${city}`;
                    tr.innerHTML = `
                        <td class="status-wait">待機</td>
                        <td>${pref}</td>
                        <td>${city}</td>
                        <td id="res-${pref}-${city}">-</td>
                        <td id="pts-${pref}-${city}">-</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            $('valTotal').textContent = cTotal;
            $('valCount').textContent = "0";
            $('valSuccess').textContent = "0";
            $('valError').textContent = "0";
        }

        // --- Nominatim API を使った境界取得 ---
        // ※制限に引っかからないよう、必ず 1.1秒 のインターバルを開けます。
        async function fetchBounds(pref, city) {
            // クエリに県名を混ぜると精度が上がる
            const prefNames = { nagano: "長野県", yamanashi: "山梨県", gunma: "群馬県", tochigi: "栃木県", niigata: "新潟県", saitama: "埼玉県", tokyo: "東京都", kanagawa: "神奈川県", chiba: "千葉県", ibaraki: "茨城県" };
            const q = encodeURIComponent(`${prefNames[pref]} ${city}`);
            
            const url = `https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`;
            
            try {
                const res = await fetch(url, { headers: { 'User-Agent': 'TateshinaCompass-Builder/0.1' } });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                
                if (data && data.length > 0 && data[0].boundingbox) {
                    const bb = data[0].boundingbox; // [minLat, maxLat, minLon, maxLon] 形式の文字列配列
                    
                    // OSMの境界はカツカツなので、外側に安全マージン（約1km）を足す
                    const minLat = parseFloat(bb[0]) - SAFE_MARGIN;
                    const maxLat = parseFloat(bb[1]) + SAFE_MARGIN;
                    const minLon = parseFloat(bb[2]) - SAFE_MARGIN;
                    const maxLon = parseFloat(bb[3]) + SAFE_MARGIN;
                    
                    // 400mメッシュでの予想地点数を計算
                    let pts = 0;
                    for(let x=minLon; x<=maxLon; x+=FIXED_MESH) {
                        for(let y=minLat; y<=maxLat; y+=FIXED_MESH) pts++;
                    }

                    return {
                        bounds: {
                            minLat: Number(minLat.toFixed(4)),
                            maxLat: Number(maxLat.toFixed(4)),
                            minLon: Number(minLon.toFixed(4)),
                            maxLon: Number(maxLon.toFixed(4))
                        },
                        points: pts
                    };
                } else {
                    throw new Error("No BoundingBox");
                }
            } catch (err) {
                console.error(`[OSM API Error] ${city}:`, err);
                return null;
            }
        }

        async function processQueue() {
            $('valStatus').textContent = "フェッチ実行中...";
            $('valStatus').style.color = "var(--accent)";
            
            for (let i = 0; i < targetQueue.length; i++) {
                if (!isRunning) break;
                
                const task = targetQueue[i];
                const { pref, city } = task;
                const tr = $(`row-${pref}-${city}`);
                
                // 行をスクロールして見せる
                tr.scrollIntoView({ behavior: 'smooth', block: 'center' });
                tr.children[0].className = "status-wait";
                tr.children[0].textContent = "🔄 取得中";

                // フェッチ処理
                const res = await fetchBounds(pref, city);
                
                if (res) {
                    // 成功
                    resultData[pref].push({
                        name: city,
                        bounds: res.bounds
                    });
                    
                    tr.children[0].className = "status-ok";
                    tr.children[0].textContent = "✓ OK";
                    $(`res-${pref}-${city}`).textContent = `[${res.bounds.minLat}, ${res.bounds.maxLat}] x [${res.bounds.minLon}, ${res.bounds.maxLon}]`;
                    $(`pts-${pref}-${city}`).textContent = res.points.toLocaleString();
                    cSuccess++;
                } else {
                    // 失敗（リトライせずダミー値を入れるかスキップ）
                    resultData[pref].push({
                        name: city,
                        bounds: { minLat: 35.0, maxLat: 36.0, minLon: 138.0, maxLon: 139.0 } // Fail-safe fallback
                    });
                    
                    tr.children[0].className = "status-err";
                    tr.children[0].textContent = "✗ ERR";
                    $(`res-${pref}-${city}`).textContent = "Error (Fallback used)";
                    cError++;
                }

                // UI更新
                $('valCount').textContent = i + 1;
                $('valSuccess').textContent = cSuccess;
                $('valError').textContent = cError;
                $('progressBar').style.width = `${((i + 1) / cTotal) * 100}%`;
                
                // 生JSONをリアルタイム更新
                $('jsonOutput').value = JSON.stringify(resultData, null, 2);

                // APIの利用規約（1秒1回）を守るための絶対ディレイ
                if (i < targetQueue.length - 1 && isRunning) {
                    await new Promise(r => setTimeout(r, 1100)); 
                }
            }
            
            if (isRunning) {
                $('valStatus').textContent = "✅ 完了！";
                $('valStatus').style.color = "#3b82f6";
                $('startBtn').disabled = false;
                $('stopBtn').disabled = true;
                $('dlBtn').disabled = false;
                isRunning = false;
            }
        }

        // --- Event Listeners ---
        $('startBtn').addEventListener('click', () => {
            if (targetQueue.length === 0) initQueue();
            isRunning = true;
            $('startBtn').disabled = true;
            $('stopBtn').disabled = false;
            $('dlBtn').disabled = true;
            processQueue();
        });

        $('stopBtn').addEventListener('click', () => {
            isRunning = false;
            $('valStatus').textContent = "⏸️ 中断されました";
            $('valStatus').style.color = "var(--danger)";
            $('startBtn').disabled = false;
            $('stopBtn').disabled = true;
            $('dlBtn').disabled = false; // 途中までのデータでもDL可能にする
        });

        $('dlBtn').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(resultData, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "kantou_koushinetsu_bounds.json");
            dlAnchorElem.click();
        });

        // 初期化
        initQueue();
    </script>
</body>
</html>
