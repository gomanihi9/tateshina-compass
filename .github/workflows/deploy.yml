name: Fast Shared Deploy

on:
  push:
    branches:
      - main
      - beta

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false # 🔴上書き競合を防ぐためfalseにします

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4

      # 💡 過去の「mainとbetaが合体した状態の公開データ」を安全に引っ張ってくる
      - name: Checkout complete gh-pages data
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: old_site

      # フォルダの組み立て処理
      - name: Merge files
        run: |
          mkdir -p _site
          
          # 1. まず過去の公開データをベースとしてコピー（これでmainもbetaも残る）
          if [ -d "old_site" ]; then
            rsync -av --exclude='.git' old_site/ _site/
          fi
          
          # 2. 今回プッシュされた最新のファイルを上書き配置
          if [ "${{ github.ref_name }}" = "main" ]; then
            # mainならルート直下に上書き
            rsync -av --exclude='_site' --exclude='old_site' --exclude='.github' ./ _site/
          else
            # betaならbetaフォルダの中に上書き
            mkdir -p _site/beta
            rsync -av --exclude='_site' --exclude='old_site' --exclude='.github' ./ _site/beta/
          fi

      # 組み立てた最新の「合体データ」を、次回のベース用としてgh-pagesブランチに保存
      - name: Save backup to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true

      # GitHub Pagesへ超高速デプロイ
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
