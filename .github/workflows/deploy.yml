name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - beta

# GitHub Pagesへのデプロイに必要な権限を付与
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # betaブランチの場合のみ、成果物を「beta」フォルダに移動させてURLを分ける
      - name: Organize build folder for beta
        if: github.ref_name == 'beta'
        run: |
          mkdir -p _site/beta
          rsync -av --exclude='_site' ./ _site/beta/
          rm -rf _site/beta/.github

      # mainブランチの場合はそのままルートに配置
      - name: Organize build folder for main
        if: github.ref_name == 'main'
        run: |
          mkdir -p _site
          rsync -av --exclude='_site' ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      # 事前に作成された _site をそのままPagesにデプロイ
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
