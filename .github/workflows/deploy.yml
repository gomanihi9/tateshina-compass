name: Super Fast Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - beta

permissions:
  contents: read
  pages: write
  id-token: write

# 🔴重要: 同じブランチでの連続プッシュ時は、古い処理を自動キャンセルして最新の処理を優先する（待ち時間削減）
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # -----------------------------------------------------------------
      # 💡 魔法のステップ: 常に「両方のURL」を生かすため、
      # サーバー側の既存のデプロイ成果物（Artifact）をダウンロードして合体させる
      # -----------------------------------------------------------------
      - name: Download existing Pages artifact (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true # 初回デプロイ時はエラーを無視する
        with:
          name: github-pages
          path: ./_site

      # mainブランチの場合：ルート階層のファイルを更新
      - name: Organize for main
        if: github.ref_name == 'main'
        run: |
          mkdir -p _site
          rsync -av --exclude='_site' --exclude='.github' ./ _site/

      # betaブランチの場合：betaフォルダの中身だけを更新
      - name: Organize for beta
        if: github.ref_name == 'beta'
        run: |
          mkdir -p _site/beta
          rsync -av --exclude='_site' --exclude='.github' ./ _site/beta/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
