name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - beta

# gh-pagesブランチへの書き込み権限を付与
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mainブランチの場合はルート直下に配置
      - name: Prepare files for main
        if: github.ref_name == 'main'
        run: |
          mkdir -p dist
          rsync -av --exclude='dist' --exclude='.github' ./ dist/

      # betaブランチの場合は「beta」フォルダの中に配置
      - name: Prepare files for beta
        if: github.ref_name == 'beta'
        run: |
          mkdir -p dist/beta
          rsync -av --exclude='dist' --exclude='.github' ./ dist/beta/

      # 💡 魔法のステップ：既存のgh-pagesブランチの内容を消さずに、今回の差分だけを安全にマージして公開する
      - name: Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages      # 公開専用のブランチ名
          folder: dist          # アップロードするフォルダ
          target-folder: ${{ github.ref_name == 'beta' && 'beta' || '.' }} # betaならbetaフォルダへ、mainならルートへ
          clean: false          # 🔴超重要：既存の別ブランチのファイルを消去しない設定
