name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - beta

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mainブランチの場合は、そのままルート階層にデプロイする準備
      - name: Prepare files for main
        if: github.ref_name == 'main'
        run: |
          mkdir -p dist_main
          rsync -av --exclude='dist_main' --exclude='.github' ./ dist_main/

      # betaブランチの場合は、betaというフォルダの中にデプロイする準備
      - name: Prepare files for beta
        if: github.ref_name == 'beta'
        run: |
          mkdir -p dist_beta/beta
          rsync -av --exclude='dist_beta' --exclude='.github' ./ dist_beta/beta/

      # mainブランチのデプロイ処理
      - name: Deploy Main to gh-pages
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist_main
          clean: false # 🔴既存のbetaフォルダを絶対に消さない

      # betaブランチのデプロイ処理
      - name: Deploy Beta to gh-pages
        if: github.ref_name == 'beta'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist_beta
          clean: false # 🔴既存のmainのファイルを絶対に消さない
